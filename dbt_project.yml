
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'finetrack_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'finetrack_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
# La syntaxe `arguments:` des tests génériques (YAML des modèles) exige dbt >= 1.10.5
require-dbt-version: ">=1.10.5"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Matérialisation et schéma par défaut de chaque couche. Ces réglages
# peuvent être surchargés dans un modèle avec `{{ config(...) }}`.
# Les noms de schéma sont utilisés tels quels grâce à la macro
# macros/generate_schema_name.sql.
models:
  finetrack_analytics:
    staging:
      +materialized: view          # données changeantes : toujours à jour
      +schema: staging
    intermediate:
      +materialized: ephemeral     # simple CTE injectée, aucun objet créé
    marts:
      +materialized: table         # modèles finaux pour la BI
      +schema: marts
