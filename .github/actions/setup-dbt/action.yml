# Action composite partagée par les workflows qui exécutent dbt.
# Elle installe Python, dbt (requirements.txt) et les packages dbt
# (dbt deps), avec un cache pour chacun.
# Les secrets Snowflake ne passent pas par ici : ils viennent de l'env du
# job appelant, et dbt deps n'en a pas besoin.
name: Installer Python et dbt
description: Installe Python, les dépendances de requirements.txt et les packages dbt (dbt deps), avec cache.

inputs:
  python-version:
    description: Version de Python à installer.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Installer Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Installer dbt (requirements.txt)
      shell: bash
      run: python -m pip install --disable-pip-version-check -r requirements.txt

    # La clé dépend de packages.yml et de package-lock.yml : une nouvelle
    # version de package invalide le cache.
    - name: Restaurer les packages dbt
      id: dbt-packages
      uses: actions/cache@v6
      with:
        path: dbt_packages
        key: dbt-packages-${{ runner.os }}-${{ hashFiles('packages.yml', 'package-lock.yml') }}

    - name: Installer les packages dbt (dbt deps)
      if: steps.dbt-packages.outputs.cache-hit != 'true'
      shell: bash
      run: dbt deps

    - name: Version de dbt
      shell: bash
      run: dbt --version
